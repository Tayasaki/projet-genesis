name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral CI-only service; not a real credential.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: genesis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d genesis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit suite first, deliberately WITHOUT a generated Prisma client and
      # without AUTH_IT_DATABASE_URL (the integration test skips itself), so a
      # missing vi.mock('@prisma/client') still fails here. Coverage thresholds
      # are evaluated only in this step.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/genesis_ci
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Run Better Auth integration test
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/genesis_ci
          AUTH_IT_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/genesis_ci
        run: pnpm exec vitest run tests/integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral CI-only service; not a real credential.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: genesis_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d genesis_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/genesis_e2e
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/genesis_e2e
          # Ephemeral CI-only secret; not a real credential.
          BETTER_AUTH_SECRET: ci-only-e2e-secret-0123456789abcdef
          CI: "true"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
