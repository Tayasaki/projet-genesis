# Local development stack: PostgreSQL + one-shot Prisma migrations + the app,
# built from this repository's Dockerfile.
#
#   cp .env.example .env     # then fill in BETTER_AUTH_SECRET and OAuth ids/secrets
#   docker compose up --build
#
# Values come from .env (read automatically by Compose). The defaults below are
# dev-only placeholders: never reuse them outside a local machine.
# DATABASE_URL is deliberately NOT read from .env: inside Compose the database
# host is `db`, not `localhost`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Dev-only placeholder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: projet-genesis
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projet-genesis"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Applies the committed Prisma migrations (same schema as production), then exits.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/projet-genesis
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/projet-genesis
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${APP_PORT:-3000}}
      # Dev-only placeholder. Generate a real one with: openssl rand -base64 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-change-me-openssl-rand-base64-32}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # OAuth providers: a provider is only enabled when both its id and secret are set.
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Optional: enables AI character generation.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
